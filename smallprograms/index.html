<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Relief Breathing Guide</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: #1e293b;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #38bdf8;
        }
        p.subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .circle-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pulse-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(56, 189, 248, 0.2);
            border: 2px solid #38bdf8;
            transition: transform 1s ease-in-out;
        }
        .instruction-text {
            font-size: 1.4rem;
            font-weight: 600;
            z-index: 10;
            color: #f1f5f9;
        }
        .timer-text {
            font-size: 2.5rem;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 20px;
        }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }
        button:hover {
            background-color: #7dd3fc;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        button.stop-btn {
            background-color: #f43f5e;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Temple & Jaw Relaxer</h1>
    <p class="subtitle">Press Start, close your eyes, and listen.</p>

    <div class="circle-container">
        <div class="pulse-circle" id="circle"></div>
        <div class="instruction-text" id="instruction">Ready</div>
    </div>

    <div class="timer-text" id="timer">4</div>

    <button id="startBtn" onclick="toggleSession()">Start Breathing Session</button>
</div>

<script>
    let isRunning = false;
    let timerInterval = null;
    let phaseIndex = 0;
    let countdown = 0;

    // Web Audio API context for tone generation
    let audioCtx = null;

    // 4s Inhale, 2s Hold, 6s Exhale (Relaxes jaw & temples)
    const pattern = [
        { name: 'Inhale', duration: 4, scale: 1.3, speak: 'Inhale slowly through your nose' },
        { name: 'Hold', duration: 2, scale: 1.3, speak: 'Hold and soften your jaw' },
        { name: 'Exhale & Relax Jaw', duration: 6, scale: 0.8, speak: 'Exhale completely, release your jaw and temples' }
    ];

    function playTone(freq = 440, duration = 0.2) {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {
            console.log("Audio not allowed yet", e);
        }
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Stop any pending speech
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.85; // Speak slowly and calmly
            utterance.pitch = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    }

    function toggleSession() {
        const btn = document.getElementById('startBtn');
        if (isRunning) {
            stopSession();
            btn.innerText = "Start Breathing Session";
            btn.classList.remove('stop-btn');
        } else {
            startSession();
            btn.innerText = "Stop Session";
            btn.classList.add('stop-btn');
        }
    }

    function startSession() {
        isRunning = true;
        phaseIndex = 0;
        runPhase();
    }

    function stopSession() {
        isRunning = false;
        clearInterval(timerInterval);
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }
        document.getElementById('instruction').innerText = "Stopped";
        document.getElementById('timer').innerText = "--";
        document.getElementById('circle').style.transform = "scale(1)";
    }

    function runPhase() {
        if (!isRunning) return;

        const current = pattern[phaseIndex];
        countdown = current.duration;

        // UI Updates
        document.getElementById('instruction').innerText = current.name;
        document.getElementById('timer').innerText = countdown;
        document.getElementById('circle').style.transform = `scale(${current.scale})`;
        document.getElementById('circle').style.transitionDuration = `${current.duration}s`;

        // Audio Cues
        playTone(current.name === 'Inhale' ? 523.25 : 349.23, 0.3); // C5 for Inhale, F4 for Exhale
        speakText(current.speak);

        // Countdown loop
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!isRunning) return;
            countdown--;
            if (countdown > 0) {
                document.getElementById('timer').innerText = countdown;
            } else {
                clearInterval(timerInterval);
                phaseIndex = (phaseIndex + 1) % pattern.length;
                runPhase();
            }
        }, 1000);
    }
</script>

</body>
</html>
