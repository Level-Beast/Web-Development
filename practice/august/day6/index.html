<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Header</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .container{
        width: 100%;
        max-width: 1200px;
        border: 2px solid red;
    }

    /* Header Container */
    .site-header {
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      padding: 12px 32px;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
    }
    .site-header-layout {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }

    /* Brand Logo */
    .logo {
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      cursor: pointer;
    }

    /* Search Bar Wrapper */
    .search-option {
      flex: 1;
      max-width: 460px;
      position: relative;
    }

    .search-option input[type="search"] {
      width: 100%;
      background-color: #242424;
      border: 1px solid transparent;
      border-radius: 500px;
      color: #ffffff;
      padding: 12px 12px 12px 48px;
      font-size: 14px;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .search-option input[type="search"]:hover {
      background-color: #2a2a2a;
      border-color: #727272;
    }

    .search-option input[type="search"]:focus {
      background-color: #2a2a2a;
      border-color: #ffffff;
      outline: none;
    }

    /* Custom Search Icon overlay */
    .search-option::before {
      content: "🔍";
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      opacity: 0.7;
      pointer-events: none;
    }

    /* Navigation Links */
    .site-link-group {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .site-link-group ul {
      display: flex;
      align-items: center;
      list-style: none;
      gap: 24px;
    }

    /* Divider between utility links and auth links */
    .site-link-group ul:not(:last-child) {
      border-right: 1px solid #2f2f2f;
      padding-right: 32px;
    }

    .site-link-group a {
      color: #b3b3b3;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      transition: color 0.2s, transform 0.2s;
      display: inline-block;
    }

    .site-link-group a:hover {
      color: #ffffff;
      transform: scale(1.04);
    }

    /* Call to Action Buttons (Sign Up & Log In) */
    .auth-links .signup-btn {
      color: #b3b3b3;
    }

    .auth-links .login-btn {
      background-color: #ffffff;
      color: #000000;
      padding: 12px 32px;
      border-radius: 500px;
    }

    .auth-links .login-btn:hover {
      color: #000000;
      transform: scale(1.04);
      background-color: #f6f6f6;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class=" container  site-header-layout">
      
      <div class="logo">Logo</div>
      
      <div class="search-option">
        <input type="search" placeholder="What do you want to play?">
      </div>
      
      <nav class="site-link-group">
        <ul class="main-nav">
          <li><a href="#premium">Premium</a></li>
          <li><a href="#support">Support</a></li>
          <li><a href="#download">Download</a></li>
        </ul>
        <ul class="auth-links">
          <li><a href="#install" class="install-btn">Install App</a></li>
          <li><a href="#signup" class="signup-btn">Sign Up</a></li>
          <li><a href="#login" class="login-btn">Log In</a></li>
        </ul>
      </nav>

    </div>
  </header>

</body>
</html>
