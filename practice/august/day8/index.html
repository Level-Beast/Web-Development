<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 2px solid red;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }
        .container h1{
            font-size: clamp(12px, 8vw , 3.5rem);
        }
        .cards {
            border: 2px solid red;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}
    </style>
</head>
<body>
    <div class="container">
        <h1>My name </h1>
    </div>
    <div class="cards">
    <div>Card 1</div>
    <div>Card 2</div>
    <div>Card 3</div>
    <div>Card 4</div>
</div>
</body>
</html>
