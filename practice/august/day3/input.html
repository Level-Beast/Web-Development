<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 1. PARENT SECTION: Full-width light-blue background -->
<section class="banner-section">
  
  <!-- 2. CONTAINER: Constrains content to middle & centers it -->
  <div class="container banner-card">
    
    <!-- 3. LEFT COLUMN: Text content stacked vertically -->
    <div class="banner-content">
      <h2>💎 Complete thinking toolkit...</h2>
      <p>Get lifetime access to over 20 thinking tool templates...</p>
      
      <!-- Bullet list items -->
      <div class="banner-features">
        <span>✓ 20 templates in PDF...</span>
        <span>✓ Member-only guides...</span>
        <span>✓ One-time payment...</span>
      </div>
    </div>

    <!-- 4. RIGHT COLUMN: Action Button -->
    <div class="banner-action">
      <a href="#" class="btn">Explore the Vault</a>
    </div>

  </div>
</section>


</body>
</html>
