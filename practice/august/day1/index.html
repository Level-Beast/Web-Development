<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SITE HEADER -->
    <header class="site-header container">
        <div class="header-logo">
            <img src="notion-logo.svg" alt="Notion Logo">
        </div>
        
        <nav class="nav-links">
            <a href="#" class="has-dropdown">Product</a>
            <a href="#" class="has-dropdown">Resources</a>
            <a href="#">Developers</a>
            <a href="#">Enterprise</a>
            <a href="#">Pricing</a>
            <a href="#">Request a demo</a>
        </nav>
        
        <div class="auth-buttons">
            <a href="#" class="btn-text">Log in</a>
            <a href="#" class="btn-primary">Get Notion free</a>
        </div>
    </header>

    <!-- MAIN BODY CONTENT -->
    <main class="main-content">
        
        <!-- HERO SECTION Wrapper holds all background elements relative to it -->
        <section class="hero-section container">
            
            <!-- Floating Little Illustrations (Positioned absolutely relative to .hero-section) -->
            <img src="avatar-row.png" class="hero-avatars" alt="Team avatars">
            <img src="floating-icon1.png" class="float-icon pos-left" alt="">
            <img src="floating-icon2.png" class="float-icon pos-right" alt="">
            
            <!-- Central Layout Context -->
            <div class="hero-text-layout">
                <h1>Where teams and agents <span class="highlight-pill">Scale together.</span></h1>
                <p>Capture context, find answers, and automate tasks with AI built for your team.</p>
                
                <div class="hero-actions">
                    <a href="#" class="btn-primary">Get Notion free</a>
                    <a href="#" class="btn-secondary">Request a demo</a>
                </div>
            </div>

            <!-- PRODUCT SHOWCASE INTERFACE CONTAINER -->
            <div class="app-screenshot-wrapper">
                <!-- Floating corner characters around the UI dashboard -->
                <img src="char-left.png" class="char-anchor left-side" alt="">
                <img src="char-right.png" class="char-anchor right-side" alt="">
                
                <div class="app-mockup">
                    <img src="ramp-hq-screenshot.png" alt="Ramp HQ Workspace Workspace Interface">
                </div>
            </div>

        
    </main>

</body>
</html>
